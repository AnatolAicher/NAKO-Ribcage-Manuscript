project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
  pre-render: scripts/validate_figures.py
  # Quarto's resource globs do not expand through the results/_latest symlink,
  # so the run-figure set (figures/**/*.{png,html} plus the public viewer) is
  # copied into _site/ by the post-render script instead.
  post-render:
    - scripts/copy_site_resources.py
    - scripts/finalize_docx.py
  resources:
    - assets/**
    # The resource glob also matches inside the docx output dir; keep that
    # tree and the supplement's Word styling template off the site.
    - "!_docx/**"
    - "!assets/reference.docx"

# Cross-page links (page.qmd#anchor) become absolute site URLs in the Word and
# PDF outputs; the HTML site keeps Quarto's relative links.
filters:
  - scripts/print_links.lua

website:
  title: "NAKO Ribcage SSM"
  site-url: https://anatolaicher.github.io/NAKO-Ribcage-Manuscript/
  description: "Statistical and surface-based shape modelling of the human rib cage from a large NAKO cohort."
  navbar:
    left:
      - { text: "Home",        href: index.qmd }
      - { text: "Manuscript",  href: manuscript.qmd }
      - { text: "Supplement",  href: supplement.qmd }
      - { text: "SSM Viewer",  href: viewer.qmd }
      - { text: "Data & Code", href: data.qmd }
      - { text: "References",  href: references.qmd }
    right:
      - icon: github
        href: https://github.com/AnatolAicher/NAKO-Ribcage-SSM
        aria-label: "Source code on GitHub"
  page-footer:
    left: "NAKO Ribcage SSM"
    center: 'Text and figures © 2026 the authors, <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/">CC BY-NC-ND 4.0</a>; build scripts <a href="https://github.com/AnatolAicher/NAKO-Ribcage-Manuscript/blob/main/scripts/LICENSE">MIT</a>.'
  # Shown below the table of contents in the right margin of every page.
  margin-footer: |
    <div class="cite-box">
    <strong>Cite this work</strong>
    <dl>
    <dt>Zenodo (model data):</dt>
    <dd><a href="https://doi.org/10.5281/zenodo.22230693">10.5281/zenodo.22230693</a></dd>
    <dt>GitHub (software):</dt>
    <dd><a href="https://github.com/AnatolAicher/NAKO-Ribcage-SSM">AnatolAicher/NAKO-Ribcage-SSM</a></dd>
    <dt>Preprint:</dt>
    <dd><a href="https://doi.org/10.64898/2026.09.01.26361964">10.64898/2026.09.01.26361964</a></dd>
    <dt>Peer-reviewed article:</dt>
    <dd class="cite-pending">tbd</dd>
    </dl>
    <a href="index.html#sec-cite">Citation text and BibTeX</a>
    </div>

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    code-overflow: wrap
    css: assets/styles.css
    link-external-newwindow: true
    format-links: false
  docx:
    reference-doc: assets/reference.docx
    toc: false
    number-sections: true

bibliography: references.bib
csl: _csl/elsevier.csl

execute:
  freeze: auto
  echo: false

crossref:
  fig-prefix: "Fig."
  tbl-prefix: "Table"
